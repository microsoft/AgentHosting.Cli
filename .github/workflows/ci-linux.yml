name: Linux Local build and test 

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "rel/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Reject tracked local agent artifacts
      shell: pwsh
      run: ./.github/scripts/verify-no-local-agent-artifacts.ps1

    - name: Setup plugin Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22

    - name: Restore plugin tooling
      run: npm --prefix .github/plugins/mcs-assistant/scripts ci --no-audit --no-fund

    - name: Build and test plugin
      shell: pwsh
      run: |
        npm --prefix .github/plugins/mcs-assistant/scripts run build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm --prefix .github/plugins/mcs-assistant/scripts test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --exit-code -- .github/plugins/mcs-assistant

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
      id: version
      with:
        path: src
        setAllVars: true
    - run: echo "NuGetPackageVersion ${{ steps.version.outputs.NuGetPackageVersion }}"

    - name: Restore
      run: dotnet restore Microsoft.Agents.Hosting.Cli.proj
  
    - name: Build Debug
      run: dotnet build --no-restore -c debug Microsoft.Agents.Hosting.Cli.proj

    - name: Build Release
      run: dotnet build --no-restore -c release Microsoft.Agents.Hosting.Cli.proj

    - name: Package
      run: dotnet pack --no-restore -c release src/Microsoft.Agents.Hosting.Cli.slnx

    - name: Test in net10
      run: dotnet test --no-build --no-restore -c debug ./src/ -f net10.0
