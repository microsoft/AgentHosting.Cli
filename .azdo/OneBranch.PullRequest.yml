#################################################################################
#                      OneBranch Pipelines - PR Build                           #
# This pipeline was created by EasyStart from a sample located at:              #
#   https://aka.ms/obpipelines/easystart/samples                                #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#                                                                               #
#################################################################################

trigger: none # https://aka.ms/obpipelines/triggers - Disable continuous integration builds for this pipeline. PR builds will be triggered by the PR trigger below.

pr:
  autoCancel: true
  branches:
    include:
       - '*'
  paths:
    include:
      - src/**

parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  MAJOR: 1
  MINOR: 1
  BUILD: 0
  REVISION: $[counter(variables['REVISION'], 20)]
  system.debug: ${{ parameters.debug }}
  ENABLE_PRS_DELAYSIGN: 0
  ROOT: $(Build.SourcesDirectory)
  REPOROOTDIRECTORY: $(Build.SourcesDirectory)
  OUTPUTROOT: $(REPOROOTDIRECTORY)\bin
  NUGET_XMLDOC_MODE: none
  EnableLocalization: true
  system_accesstoken: $(System.AccessToken)

  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest' # https://aka.ms/obpipelines/containers

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: tools
      type: github
      endpoint: bic-proxima-shared-stamp
      name: bic/Microsoft.Botframework.Builds
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    featureFlags:
        WindowsHostVersion:
          Disk: Large
          Version: 2022
        networkisolation:
          policy: GitHub,Permissive
    globalSdl:
      suppression:
        suppressionFile: '$(Build.SourcesDirectory)/.gdn/Cli.gdnsuppress'
      tsa:
        enabled: false
      binskim:
        break: true
      policheck:
        break: true

    stages:
    - stage: Build_Assets
      jobs:
      - job: Debug
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT'
          ob_sdl_binskim_break: true
          ob_git_fetchDepth: -1
        steps:
          - checkout: self
            path: s
            env:
              ob_restore_phase: true

          - checkout: tools
            path: s/tools

          - task: PowerShell@2
            displayName: Replace nuget.config files
            inputs:
              targetType: inline
              script: |
                $repoRoot = "$(Build.SourcesDirectory)"
                $sourceConfig = Join-Path $repoRoot ".azdo\nuget.config"

                if (-not (Test-Path $sourceConfig)) {
                  throw "Source nuget.config not found at $sourceConfig"
                }

                Get-ChildItem -Path $repoRoot -Filter nuget.config -File -Recurse |
                  Where-Object { $_.FullName -ne $sourceConfig } |
                  ForEach-Object {
                    Copy-Item -Path $sourceConfig -Destination $_.FullName -Force
                    Write-Host "Replaced $($_.FullName)"
                  }

          - task: UseDotNet@2
            displayName: Install .NET 8 SDK
            inputs:
              packageType: sdk
              version: 8.0.x
              performMultiLevelLookup: true
            env:
              ob_restore_phase: true

          - task: UseDotNet@2
            displayName: Install .NET SDK from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true
              performMultiLevelLookup: true
            env:
              ob_restore_phase: true

          - task: NuGetAuthenticate@1

          - script: dotnet tool restore --configfile $(Build.SourcesDirectory)/.azdo/nuget.config
            displayName: Dotnet tools restore
            workingDirectory: $(Build.SourcesDirectory)
            env:
              ob_restore_phase: true

          - template: Agent-Hosting-CLI/templates/build-sign-package.yaml@tools
            parameters:
              NugetConfg: $(Build.SourcesDirectory)/.azdo/nuget.config
              configuration: debug
              rootProjectFolder: '$(Build.SourcesDirectory)'   # -> ...\src\libraries exists
              isOfficialBuild: false
              OutputDirectoryRoot: '$(OUTPUTROOT)'

          - task: PowerShell@2
            displayName: Repeat terminal output drain test 50 times
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: |
                $project = "src\Microsoft.Agents.Hosting.Cli.Tests\Microsoft.Agents.Hosting.Cli.Tests.csproj"
                $filter = "FullyQualifiedName~LinuxTerminalOutputIsDrainedWhileSessionProcessRemainsRunning"
                $configuration = if (Test-Path "src\Microsoft.Agents.Hosting.Cli.Tests\bin\release\net10.0\Microsoft.Agents.Hosting.Cli.Tests.dll") { "release" } else { "debug" }
                Write-Host "Using configuration: $configuration"
                $failures = 0
                for ($iteration = 1; $iteration -le 50; $iteration++) {
                  $output = dotnet test $project --no-build --no-restore -c $configuration --filter $filter 2>&1 | Out-String
                  if ($LASTEXITCODE -ne 0 -or $output -notmatch "Passed:\s+1,\s+Skipped:\s+0") {
                    $failures++
                    Write-Host "##vso[task.logissue type=error]Iteration $iteration failed or was skipped."
                    Write-Host $output
                  }
                  else {
                    Write-Host "Iteration $iteration passed."
                  }
                }
                Write-Host "Failures: $failures / 50"
                if ($failures -gt 0) { exit 1 }
          - task: CopyFiles@2
            displayName: "Copy Files for 'Publish packages (Debug)' publish task"
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/src'
              Contents: '**/*.nupkg'
              FlattenFolders : true
              TargetFolder: $(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT/packagesDebug
            condition: always()

          - task: CopyFiles@2
            displayName: "Copy Files for 'Publish diagnostic build logs (Debug)' publish task"
            inputs:
              SourceFolder: 'bin\logs'
              Contents: '**'
              TargetFolder: $(Build.ArtifactStagingDirectory)/ONEBRANCH_ARTIFACT/diagnosticLogs
            condition: always()
